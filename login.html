<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — What's that?</title>
  
  <!-- Tailwind CSS CDN & Config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif']
          },
          colors: {
            brand: {
              DEFAULT: '#4B46FF',
              hover: '#3934E6',
              accent: '#6C8CFF',
              navy: '#0B1230',
              dark: '#070B1D',
              ice: '#F7F9FF',
              main: '#F5F7FC',
              secondary: '#E9EDFF',
              success: '#35C98A',
              warning: '#FFC857',
              error: '#FF5C70',
              text: '#20263D',
              muted: '#737B94'
            }
          },
          borderRadius: {
            '2xl': '18px',
            '3xl': '24px'
          }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .field-input {
      width: 100%;
      background: #FFFFFF;
      border: 1px solid #E9EDFF;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 500;
      color: #0B1230;
      transition: all 0.15s ease;
      outline: none;
    }
    .field-input:focus {
      border-color: #4B46FF;
      box-shadow: 0 0 0 4px rgba(75, 70, 255, 0.12);
    }
    .field-input::placeholder { color: #737B94; font-weight: 400; }
    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #737B94;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .demo-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: #FFFFFF;
      border: 1px solid #E9EDFF;
      border-radius: 14px;
      width: 100%;
      text-align: left;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }
    .demo-btn:hover {
      background: #F7F9FF;
      border-color: rgba(75, 70, 255, 0.3);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(75, 70, 255, 0.08);
    }
    .submit-btn {
      width: 100%;
      background: #4B46FF;
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      padding: 13px 20px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(75, 70, 255, 0.3);
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .submit-btn:hover {
      background: #3934E6;
      box-shadow: 0 8px 22px rgba(75, 70, 255, 0.4);
      transform: translateY(-1px);
    }
    .submit-btn:active { transform: scale(0.98); }
  </style>
</head>
<body class="bg-[#F5F7FC] text-[#20263D] min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="w-full px-6 py-4 flex items-center justify-between border-b border-[#E9EDFF] bg-white/90 backdrop-blur-md sticky top-0 z-40">
    <a href="index.html" class="flex items-center">
      <img src="assets/logo.png" alt="Logo" class="h-16 sm:h-18 w-auto object-contain hover:scale-105 transition-transform">
    </a>
    <a href="index.html" title="Back to Overview" class="text-xs font-bold text-[#737B94] hover:text-[#4B46FF] flex items-center justify-center transition-colors bg-[#F7F9FF] hover:bg-[#E9EDFF] p-2.5 rounded-xl border border-[#E9EDFF]">
      <i data-lucide="arrow-left" class="w-4 h-4 text-[#4B46FF]"></i>
    </a>
  </header>

  <!-- Main -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-8 relative overflow-hidden">
    <!-- Subtle Background Glows -->
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-[#4B46FF]/5 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-[460px] relative z-10">

      <!-- Title & Mascot Logo -->
      <div class="text-center mb-8">
        <img src="assets/logo.png" alt="Logo" class="h-36 sm:h-44 w-auto object-contain mx-auto mb-3 hover:scale-105 transition-transform duration-300">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-[#0B1230] tracking-tight">Welcome back</h1>
        <p class="text-[#737B94] text-sm mt-1 font-medium">Sign in to your account</p>
      </div>

      <!-- Quick Demo Access -->
      <div class="mb-6">
        <p class="text-[11px] font-bold uppercase tracking-widest text-[#737B94] mb-3 text-center">Quick Demo Access</p>
        <div class="grid grid-cols-2 gap-3">
          <button type="button" onclick="loginAsDemo('student')" class="demo-btn">
            <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=150" class="w-9 h-9 rounded-full object-cover border border-[#E9EDFF] flex-shrink-0" alt="Alex">
            <div class="min-w-0">
              <div class="text-xs font-bold text-[#0B1230] truncate">Alex Morgan</div>
              <div class="text-[11px] text-[#737B94] font-medium truncate">3rd Year Student</div>
            </div>
          </button>
          <button type="button" onclick="loginAsDemo('faculty','fac-ai-01')" class="demo-btn">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=250" class="w-9 h-9 rounded-full object-cover border border-[#E9EDFF] flex-shrink-0" alt="Dr Sarah">
            <div class="min-w-0">
              <div class="text-xs font-bold text-[#0B1230] truncate">Dr. Sarah Jenkins</div>
              <div class="text-[11px] text-[#737B94] font-medium truncate">AI &amp; ML Faculty</div>
            </div>
          </button>
        </div>
      </div>

      <!-- Divider -->
      <div class="flex items-center gap-3 mb-6">
        <div class="flex-1 h-px bg-[#E9EDFF]"></div>
        <span class="text-[11px] font-bold text-[#737B94] uppercase tracking-wider">or sign in manually</span>
        <div class="flex-1 h-px bg-[#E9EDFF]"></div>
      </div>

      <!-- Form Card -->
      <div class="card-modern bg-white p-7 shadow-lg border-[#E9EDFF]">
        <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">

          <!-- Signup-only fields (hidden by default) -->
          <div id="field-name" class="hidden">
            <label class="field-label">Full Name</label>
            <input type="text" id="input-name" placeholder="e.g. Alex Morgan" class="field-input">
          </div>

          <div id="field-student-year" class="hidden">
            <label class="field-label">Academic Year</label>
            <select id="input-year" class="field-input">
              <option value="year-1">1st Year</option>
              <option value="year-2">2nd Year</option>
              <option value="year-3" selected>3rd Year</option>
              <option value="year-4">4th Year</option>
            </select>
          </div>

          <div id="field-faculty-domain" class="hidden">
            <label class="field-label">Subject Specialization</label>
            <select id="input-domain" class="field-input">
              <option value="Artificial Intelligence &amp; ML">Artificial Intelligence &amp; Machine Learning</option>
              <option value="Data Structures &amp; Algorithms">Data Structures &amp; Algorithms</option>
              <option value="Web &amp; Mobile Development">Web &amp; Mobile Development</option>
              <option value="Cloud &amp; Systems">Cloud &amp; Systems Architecture</option>
              <option value="Mathematics &amp; Statistics">Mathematics &amp; Statistics</option>
              <option value="Cyber Security">Cyber Security &amp; Cryptography</option>
            </select>
          </div>

          <!-- Email -->
          <div>
            <label class="field-label" id="label-email">Email Address</label>
            <input type="email" id="input-email" required placeholder="alex.morgan@studybuddy.edu" class="field-input">
          </div>

          <!-- Password -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="field-label" style="margin-bottom:0">Password</label>
              <a href="#" onclick="showToast('Password reset link sent to demo email!', 'info'); return false;" class="text-[11px] font-medium text-[#737B94] hover:text-[#4B46FF] transition-colors">Forgot password?</a>
            </div>
            <input type="password" id="input-password" autocomplete="current-password" required value="password123" placeholder="••••••••" class="field-input">
          </div>

          <!-- Submit -->
          <div class="pt-2">
            <button type="submit" id="submit-auth-btn" class="submit-btn">
              <span id="btn-text">Sign In</span>
              <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
          </div>

        </form>

        <!-- Sign up toggle -->
        <div class="mt-6 pt-4 border-t border-[#E9EDFF] text-center">
          <span class="text-xs text-[#737B94] font-medium" id="auth-switch-text">Don't have an account?</span>
          <button type="button" onclick="toggleAuthMode()" id="auth-switch-btn" class="text-xs font-bold text-[#4B46FF] hover:text-[#3934E6] hover:underline ml-1.5 transition-colors">Sign up now</button>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-[#E9EDFF] bg-white py-4 px-4 text-center text-xs text-[#737B94]">
    <div class="max-w-7xl mx-auto flex items-center justify-center">
      <img src="assets/logo.png" alt="Logo" class="h-12 w-auto object-contain">
    </div>
  </footer>

  <script src="js/data.js?v=2.1"></script>
  <script src="js/app.js?v=2.1"></script>
  <script>
    let currentRole = "student";
    let isSignUp = false;

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("role") === "faculty") currentRole = "faculty";
    if (urlParams.get("tab") === "signup") isSignUp = true;

    function toggleAuthMode() {
      isSignUp = !isSignUp;
      updateVisibility();
    }

    function updateVisibility() {
      const fieldName   = document.getElementById("field-name");
      const fieldYear   = document.getElementById("field-student-year");
      const fieldDomain = document.getElementById("field-faculty-domain");
      const switchText  = document.getElementById("auth-switch-text");
      const switchBtn   = document.getElementById("auth-switch-btn");
      const authTitle   = document.querySelector("h1");
      const authSub     = document.querySelector("h1 + p");
      const emailInput  = document.getElementById("input-email");
      const labelEmail  = document.getElementById("label-email");
      const btnText     = document.getElementById("btn-text");

      if (isSignUp) {
        fieldName.classList.remove("hidden");
        if (currentRole === "student") {
          fieldYear.classList.remove("hidden");
          fieldDomain.classList.add("hidden");
          authTitle.textContent = "Create Student Account";
          authSub.textContent = "Access year-wise subjects and get faculty help";
          btnText.textContent = "Create Student Account";
        } else {
          fieldYear.classList.add("hidden");
          fieldDomain.classList.remove("hidden");
          authTitle.textContent = "Faculty Registration";
          authSub.textContent = "Join the teaching board & resolve student doubts";
          btnText.textContent = "Register as Faculty";
        }
        switchText.textContent = "Already have an account?";
        switchBtn.textContent = "Sign in here";
      } else {
        fieldName.classList.add("hidden");
        fieldYear.classList.add("hidden");
        fieldDomain.classList.add("hidden");
        authTitle.textContent = "Welcome back";
        authSub.textContent = "Sign in to your What's that? account";
        btnText.textContent = "Sign In";
        switchText.textContent = "Don't have an account?";
        switchBtn.textContent = "Sign up now";
        emailInput.placeholder = "alex.morgan@studybuddy.edu";
        labelEmail.textContent = "Email Address";
      }
    }

    function loginAsDemo(role, facultyId = null) {
      if (role === 'student') {
        const user = {
          role: "student", id: "student-" + Date.now(),
          name: "Alex Morgan", yearId: "year-3", yearName: "3rd Year (Junior)", email: "alex.morgan@studybuddy.edu",
          avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=150"
        };
        DB.setCurrentUser(user);
        window.location.href = "student-dashboard.html";
      } else {
        const user = {
          role: "faculty", id: facultyId || "fac-ai-01", name: "Dr. Sarah Jenkins",
          title: "Lead Faculty", domain: "Artificial Intelligence & ML", email: "sarah.jenkins@studybuddy.edu",
          avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=250", status: "online"
        };
        DB.setCurrentUser(user);
        window.location.href = "faculty-dashboard.html";
      }
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById("input-email").value.toLowerCase();
      
      // Auto-detect role from email if not explicitly set
      if (email.includes('faculty') || email.includes('jenkins') || email.includes('dr.')) {
        currentRole = 'faculty';
      } else {
        currentRole = 'student';
      }

      let name = document.getElementById("input-name").value;
      if (!name) {
         let prefix = email.split('@')[0];
         prefix = prefix.replace(/[^a-zA-Z]/g, ' ').trim();
         if (!prefix) {
             name = currentRole === "student" ? "Alex Morgan" : "Dr. Sarah Jenkins";
         } else {
             name = prefix.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
         }
      }

      if (currentRole === "student") {
        const yearSelect = document.getElementById("input-year");
        const yearId     = yearSelect ? yearSelect.value : "year-3";
        const yearObj    = (STUDY_BUDDY_DATA.years || []).find(y => y.id === yearId) || { id: "year-3", name: "3rd Year (Junior)" };
        const user = {
          role: "student", id: "student-" + Date.now(),
          name, yearId: yearObj.id, yearName: yearObj.name, email,
          avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=150"
        };
        DB.setCurrentUser(user);
        showToast(`Signed in as ${user.name}`);
        setTimeout(() => { window.location.href = "student-dashboard.html"; }, 300);
      } else {
        const domainSelect = document.getElementById("input-domain");
        const domain       = domainSelect ? domainSelect.value : "Artificial Intelligence & ML";
        const facultyMatch = DB.getFacultyForDomain ? DB.getFacultyForDomain(domain) : { id: "fac-ai-01", name: "Dr. Sarah Jenkins", title: "Lead Faculty", domain, email, avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=250", status: "online" };
        const user = {
          role: "faculty", id: facultyMatch.id, name,
          title: facultyMatch.title, domain, email,
          avatar: facultyMatch.avatar, status: "online"
        };
        DB.setCurrentUser(user);
        showToast(`Signed in as ${user.name}`);
        setTimeout(() => { window.location.href = "faculty-dashboard.html"; }, 300);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      updateVisibility();
      lucide.createIcons();
    });
  </script>
</body>
</html>
