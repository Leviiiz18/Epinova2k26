<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Study Buddy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .field-input {
      width: 100%;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      color: #0f172a;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }
    .field-input:focus {
      border-color: #0f172a;
      box-shadow: 0 0 0 3px rgba(15,23,42,0.08);
    }
    .field-input::placeholder { color: #94a3b8; }
    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 5px;
    }
    .demo-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      width: 100%;
      text-align: left;
      transition: background 0.15s, border-color 0.15s;
      cursor: pointer;
    }
    .demo-btn:hover { background: #f8fafc; border-color: #cbd5e1; }
    .submit-btn {
      width: 100%;
      background: #0f172a;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: 0.01em;
    }
    .submit-btn:hover { background: #1e293b; }
    .submit-btn:active { transform: scale(0.99); }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="w-full px-6 py-4 flex items-center justify-between border-b border-slate-200 bg-white">
    <a href="index.html" class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-slate-900 flex items-center justify-center text-white">
        <i data-lucide="graduation-cap" class="w-4 h-4"></i>
      </div>
      <span class="text-sm font-bold text-slate-900 tracking-tight">Study Buddy</span>
    </a>
    <a href="index.html" class="text-xs font-medium text-slate-500 hover:text-slate-900 flex items-center gap-1.5 transition-colors">
      <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
      <span>Back to Overview</span>
    </a>
  </header>

  <!-- Main -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-6">
    <div class="w-full max-w-[420px]">

      <!-- Title -->
      <div class="text-center mb-8">
        <div class="w-12 h-12 rounded-2xl bg-slate-900 flex items-center justify-center text-white mx-auto mb-4">
          <i data-lucide="graduation-cap" class="w-5 h-5"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-950 tracking-tight">Welcome back</h1>
        <p class="text-slate-500 text-sm mt-1.5">Sign in to your Study Buddy account</p>
      </div>

      <!-- Quick Demo Access -->
      <div class="mb-6">
        <p class="text-[11px] font-bold uppercase tracking-widest text-slate-400 mb-3 text-center">Quick Demo Access</p>
        <div class="grid grid-cols-2 gap-2.5">
          <button type="button" onclick="loginAsDemo('student')" class="demo-btn">
            <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=150" class="w-8 h-8 rounded-full object-cover border border-slate-200 flex-shrink-0" alt="Alex">
            <div>
              <div class="text-xs font-bold text-slate-900">Alex Morgan</div>
              <div class="text-[11px] text-slate-500">3rd Year Student</div>
            </div>
          </button>
          <button type="button" onclick="loginAsDemo('faculty','fac-ai-01')" class="demo-btn">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=250" class="w-8 h-8 rounded-full object-cover border border-slate-200 flex-shrink-0" alt="Dr Sarah">
            <div>
              <div class="text-xs font-bold text-slate-900">Dr. Sarah Jenkins</div>
              <div class="text-[11px] text-slate-500">AI &amp; ML Faculty</div>
            </div>
          </button>
        </div>
      </div>

      <!-- Divider -->
      <div class="flex items-center gap-3 mb-6">
        <div class="flex-1 h-px bg-slate-200"></div>
        <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">or sign in manually</span>
        <div class="flex-1 h-px bg-slate-200"></div>
      </div>

      <!-- Form Card -->
      <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
        <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="p-6 space-y-4">

          <!-- Signup-only fields (hidden by default) -->
          <div id="field-name" class="hidden">
            <label class="field-label">Full Name</label>
            <input type="text" id="input-name" placeholder="e.g. Alex Morgan" class="field-input">
          </div>

          <div id="field-student-year" class="hidden">
            <label class="field-label">Academic Year</label>
            <select id="input-year" class="field-input">
              <option value="year-1">1st Year</option>
              <option value="year-2">2nd Year</option>
              <option value="year-3" selected>3rd Year</option>
              <option value="year-4">4th Year</option>
            </select>
          </div>

          <div id="field-faculty-domain" class="hidden">
            <label class="field-label">Subject Specialization</label>
            <select id="input-domain" class="field-input">
              <option value="Artificial Intelligence &amp; ML">Artificial Intelligence &amp; Machine Learning</option>
              <option value="Data Structures &amp; Algorithms">Data Structures &amp; Algorithms</option>
              <option value="Web &amp; Mobile Development">Web &amp; Mobile Development</option>
              <option value="Cloud &amp; Systems">Cloud &amp; Systems Architecture</option>
              <option value="Mathematics &amp; Statistics">Mathematics &amp; Statistics</option>
              <option value="Cyber Security">Cyber Security &amp; Cryptography</option>
            </select>
          </div>

          <!-- Email -->
          <div>
            <label class="field-label" id="label-email">Email Address</label>
            <input type="email" id="input-email" required placeholder="alex.morgan@studybuddy.edu" class="field-input">
          </div>

          <!-- Password -->
          <div>
            <div class="flex items-center justify-between mb-[5px]">
              <label class="field-label" style="margin-bottom:0">Password</label>
              <a href="#" onclick="showToast('Password reset link sent to demo email!', 'info'); return false;" class="text-[11px] text-slate-400 hover:text-slate-700 transition-colors">Forgot password?</a>
            </div>
            <input type="password" id="input-password" autocomplete="current-password" required value="password123" placeholder="••••••••" class="field-input">
          </div>

          <!-- Submit -->
          <div class="pt-1">
            <button type="submit" id="submit-auth-btn" class="submit-btn">
              <span id="btn-text">Sign In</span>
              <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
          </div>

        </form>

        <!-- Sign up toggle -->
        <div class="px-6 pb-5 text-center">
          <span class="text-xs text-slate-500" id="auth-switch-text">Don't have an account?</span>
          <button type="button" onclick="toggleAuthMode()" id="auth-switch-btn" class="text-xs font-semibold text-slate-700 hover:text-slate-950 hover:underline ml-1.5 transition-colors">Sign up now</button>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="py-4 text-center text-xs text-slate-400 border-t border-slate-200 bg-white mt-auto">
    <span>Study Buddy Platform &bull; Academic Doubt Resolution Engine</span>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentRole = "student";
    let isSignUp = false;

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("role") === "faculty") currentRole = "faculty";
    if (urlParams.get("tab") === "signup") isSignUp = true;

    function toggleAuthMode() {
      isSignUp = !isSignUp;
      updateVisibility();
    }

    function updateVisibility() {
      const fieldName   = document.getElementById("field-name");
      const fieldYear   = document.getElementById("field-student-year");
      const fieldDomain = document.getElementById("field-faculty-domain");
      const switchText  = document.getElementById("auth-switch-text");
      const switchBtn   = document.getElementById("auth-switch-btn");
      const authTitle   = document.querySelector("h1");
      const authSub     = document.querySelector("h1 + p");
      const emailInput  = document.getElementById("input-email");
      const labelEmail  = document.getElementById("label-email");
      const btnText     = document.getElementById("btn-text");

      if (isSignUp) {
        fieldName.classList.remove("hidden");
        if (currentRole === "student") {
          fieldYear.classList.remove("hidden");
          fieldDomain.classList.add("hidden");
          authTitle.textContent = "Create Student Account";
          authSub.textContent = "Access year-wise subjects and get faculty help";
          btnText.textContent = "Create Student Account";
        } else {
          fieldYear.classList.add("hidden");
          fieldDomain.classList.remove("hidden");
          authTitle.textContent = "Faculty Registration";
          authSub.textContent = "Join the teaching board & resolve student doubts";
          btnText.textContent = "Register as Faculty";
        }
        switchText.textContent = "Already have an account?";
        switchBtn.textContent = "Sign in here";
      } else {
        fieldName.classList.add("hidden");
        fieldYear.classList.add("hidden");
        fieldDomain.classList.add("hidden");
        authTitle.textContent = "Welcome back";
        authSub.textContent = "Sign in to your Study Buddy account";
        btnText.textContent = "Sign In";
        switchText.textContent = "Don't have an account?";
        switchBtn.textContent = "Sign up now";
        emailInput.placeholder = "alex.morgan@studybuddy.edu";
        labelEmail.textContent = "Email Address";
      }
    }

    function loginAsDemo(role, facultyId = null) {
      if (role === 'student') {
        const user = {
          role: "student", id: "student-" + Date.now(),
          name: "Alex Morgan", yearId: "year-3", yearName: "3rd Year (Junior)", email: "alex.morgan@studybuddy.edu",
          avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=150"
        };
        DB.setCurrentUser(user);
        window.location.href = "student-dashboard.html";
      } else {
        const user = {
          role: "faculty", id: facultyId || "fac-ai-01", name: "Dr. Sarah Jenkins",
          title: "Lead Faculty", domain: "Artificial Intelligence & ML", email: "sarah.jenkins@studybuddy.edu",
          avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=250", status: "online"
        };
        DB.setCurrentUser(user);
        window.location.href = "faculty-dashboard.html";
      }
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById("input-email").value.toLowerCase();
      
      // Auto-detect role from email if not explicitly set
      if (email.includes('faculty') || email.includes('jenkins') || email.includes('dr.')) {
        currentRole = 'faculty';
      } else {
        currentRole = 'student';
      }

      let name = document.getElementById("input-name").value;
      if (!name) {
         let prefix = email.split('@')[0];
         prefix = prefix.replace(/[^a-zA-Z]/g, ' ').trim();
         if (!prefix) {
             name = currentRole === "student" ? "Alex Morgan" : "Dr. Sarah Jenkins";
         } else {
             name = prefix.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
         }
      }

      if (currentRole === "student") {
        const yearSelect = document.getElementById("input-year");
        const yearId     = yearSelect ? yearSelect.value : "year-3";
        const yearObj    = (STUDY_BUDDY_DATA.years || []).find(y => y.id === yearId) || { id: "year-3", name: "3rd Year (Junior)" };
        const user = {
          role: "student", id: "student-" + Date.now(),
          name, yearId: yearObj.id, yearName: yearObj.name, email,
          avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=150"
        };
        DB.setCurrentUser(user);
        showToast(`Signed in as ${user.name}`);
        setTimeout(() => { window.location.href = "student-dashboard.html"; }, 300);
      } else {
        const domainSelect = document.getElementById("input-domain");
        const domain       = domainSelect ? domainSelect.value : "Artificial Intelligence & ML";
        const facultyMatch = DB.getFacultyForDomain ? DB.getFacultyForDomain(domain) : { id: "fac-ai-01", name: "Dr. Sarah Jenkins", title: "Lead Faculty", domain, email, avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=250", status: "online" };
        const user = {
          role: "faculty", id: facultyMatch.id, name,
          title: facultyMatch.title, domain, email,
          avatar: facultyMatch.avatar, status: "online"
        };
        DB.setCurrentUser(user);
        showToast(`Signed in as ${user.name}`);
        setTimeout(() => { window.location.href = "faculty-dashboard.html"; }, 300);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      updateVisibility();
      lucide.createIcons();
    });
  </script>
</body>
</html>
